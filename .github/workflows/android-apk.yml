name: Build ChatX Android APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Your deployed HTTPS Render URL (for example https://chatx-live.onrender.com)'
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          case "$SITE_URL" in https://*.onrender.com|https://*.onrender.com/) ;; *) echo 'Use your Render HTTPS URL'; exit 1;; esac
          gradle assembleDebug -PchatxUrl="$SITE_URL" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ChatX-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
